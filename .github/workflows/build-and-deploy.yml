name: Build Firmware & Deploy Web Flasher

# Baut bei JEDEM Commit (alle Branches) und bei Pull Requests.
#  - Jeder Build:      Binaries als Actions-Artefakt zum Download
#  - Push auf main:    Web-Flasher auf GitHub Pages + Release "latest" (feste Download-URL)
#  - Tag v*:           Versioniertes GitHub Release mit allen Binaries
on:
  push:
    branches: [ '**' ]
    tags: [ 'v*' ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  PIO_ENV: lilygo-t-display
  FW_BASE_VERSION: 2.1.0

jobs:
  build:
    name: Build ESP32 Firmware
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7

      - name: Determine version
        id: version
        run: |
          SHORT_SHA="${GITHUB_SHA::7}"
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            VERSION="${GITHUB_REF_NAME#v}"
          else
            VERSION="${FW_BASE_VERSION}+${SHORT_SHA}"
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Firmware version: $VERSION"

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.11'

      - name: Cache PlatformIO
        uses: actions/cache@v6
        with:
          path: ~/.platformio
          key: ${{ runner.os }}-pio-${{ hashFiles('platformio.ini') }}
          restore-keys: |
            ${{ runner.os }}-pio-

      - name: Install PlatformIO & esptool
        run: |
          python -m pip install --upgrade pip
          pip install platformio esptool

      - name: Build Firmware with PlatformIO
        run: pio run -e "$PIO_ENV"

      - name: Prepare binaries & merged flash image
        run: |
          BUILD=".pio/build/$PIO_ENV"
          mkdir -p dist
          cp "$BUILD/firmware.bin"   dist/firmware.bin
          cp "$BUILD/bootloader.bin" dist/bootloader.bin
          cp "$BUILD/partitions.bin" dist/partitions.bin

          BOOT_APP=$(find ~/.platformio/packages -name boot_app0.bin -path '*partitions*' | head -n 1)
          test -n "$BOOT_APP" || { echo "boot_app0.bin not found"; exit 1; }
          cp "$BOOT_APP" dist/boot_app0.bin

          # Komplett-Image fuer Offset 0x0
          python -m esptool --chip esp32 merge-bin \
            -o dist/merged-firmware.bin \
            --flash-mode dio --flash-freq 40m --flash-size 4MB \
            0x1000  dist/bootloader.bin \
            0x8000  dist/partitions.bin \
            0xe000  dist/boot_app0.bin \
            0x10000 dist/firmware.bin

          ls -l dist

      - name: Prepare web flasher site
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          mkdir -p site
          cp -r docs/. site/
          cp dist/*.bin site/
          BUILD_INFO="Build ${VERSION} · Commit ${GITHUB_SHA::7} · $(date -u '+%Y-%m-%d %H:%M UTC')"
          # Versionsnummer in Manifest und Seite eintragen
          jq --arg v "$VERSION" '.version = $v' docs/manifest.json > site/manifest.json
          sed -i "s|__FW_VERSION__|${VERSION}|g; s|__BUILD_INFO__|${BUILD_INFO}|g" site/index.html

      - name: Upload firmware artifact (Download)
        uses: actions/upload-artifact@v7
        with:
          name: esp32-morse-trainer-${{ steps.version.outputs.version }}
          path: dist/*
          if-no-files-found: error

      - name: Upload web flasher site
        uses: actions/upload-pages-artifact@v5
        with:
          path: site/

  deploy-pages:
    name: Deploy Web Flasher (GitHub Pages)
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    concurrency:
      group: pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5

  release:
    name: Publish Release
    needs: build
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency:
      group: release-${{ github.ref }}
      cancel-in-progress: false
    steps:
      - name: Download firmware artifact
        uses: actions/download-artifact@v8
        with:
          name: esp32-morse-trainer-${{ needs.build.outputs.version }}
          path: dist

      - name: Rolling release "latest" (main)
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ needs.build.outputs.version }}
        run: |
          gh release delete latest --repo "$GITHUB_REPOSITORY" --cleanup-tag --yes || true
          gh release create latest dist/*.bin \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --prerelease \
            --title "Latest build ($VERSION)" \
            --notes "Automatischer Build von main, Commit ${GITHUB_SHA}. Web-Flasher: https://${GITHUB_REPOSITORY_OWNER,,}.github.io/${GITHUB_REPOSITORY#*/}/"

      - name: Versioned release (tag)
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/*.bin \
            --repo "$GITHUB_REPOSITORY" \
            --title "$GITHUB_REF_NAME" \
            --generate-notes
