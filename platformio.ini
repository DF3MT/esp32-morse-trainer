; ============================================================
; Morse Trainer — LilyGO T-Display v1.1 (ESP32 + ST7789)
; ============================================================
[env:lilygo-t-display]
platform  = espressif32 @ 6.10.0
board     = esp32dev
framework = arduino
upload_port = COM13
upload_speed = 460800
; No --no-stub: with the ROM loader the NimBLE bonds in NVS were lost on every upload (suspected over-erase)
monitor_port = COM13
monitor_speed = 115200

build_flags =
    ; ----- TFT_eSPI: ST7789 135x240 (LilyGO TTGO T-Display Setup 25) -----
    -D USER_SETUP_LOADED=1
    -D ST7789_DRIVER=1
    -D TFT_SDA_READ=1
    -D TFT_WIDTH=135
    -D TFT_HEIGHT=240
    -D CGRAM_OFFSET=1
    -D TFT_MOSI=19
    -D TFT_SCLK=18
    -D TFT_CS=5
    -D TFT_DC=16
    -D TFT_RST=23
    -D TFT_BL=4
    -D TFT_BACKLIGHT_ON=HIGH
    -D LOAD_GLCD=1
    -D LOAD_FONT2=1
    -D LOAD_FONT4=1
    -D LOAD_FONT6=1
    -D LOAD_FONT7=1
    -D LOAD_FONT8=1
    -D LOAD_GFXFF=1
    -D SMOOTH_FONT=1
    -D SPI_FREQUENCY=40000000
    -D SPI_READ_FREQUENCY=6000000
    ; ----- Project config -----
    -D CORE_DEBUG_LEVEL=0
    -D USE_NIMBLE

lib_deps =
    bodmer/TFT_eSPI @ 2.5.43
    igorantolic/Ai Esp32 Rotary Encoder @ 1.7
    h2zero/NimBLE-Arduino @ 1.4.3
    t-vk/ESP32 BLE Keyboard @ 0.3.2
    links2004/WebSockets @ 2.7.3
